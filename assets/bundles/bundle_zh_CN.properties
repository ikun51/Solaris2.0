block.燃烧锅炉.description = 燃烧任意可燃物品，将水加热为蒸汽，供蒸汽轮机使用\n[accent]燃料：任意具有燃烧性的物品[]\n[blue]输入：水；输出：蒸汽（1:1）[]\n[yellow]效率 = 燃料燃烧性，线性决定进水与出气速度[]

